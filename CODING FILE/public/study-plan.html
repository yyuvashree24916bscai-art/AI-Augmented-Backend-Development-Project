<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Study Plan — AI StudyBuddy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Personalized Study Plan</h1>
      <p class="page-subtitle">Formulate a strategic, phased study roadmap tailored to your target exam date and daily study availability.</p>
    </div>

    <div id="plan-alert-container"></div>

    <div class="card" style="max-width: 820px; margin: 0 auto 24px auto;">
      <form id="study-plan-form">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="plan-subject" class="form-label">Subject / Course Name</label>
            <input type="text" id="plan-subject" class="form-input" placeholder="e.g. Operating Systems & Algorithms" required>
          </div>

          <div class="form-group">
            <label for="plan-exam-date" class="form-label">Target Exam Date</label>
            <input type="date" id="plan-exam-date" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label for="plan-daily-hours" class="form-label">Dedicated Daily Study Time</label>
          <select id="plan-daily-hours" class="form-select">
            <option value="1">1 Hour / Day</option>
            <option value="2" selected>2 Hours / Day (Recommended)</option>
            <option value="3">3 Hours / Day</option>
            <option value="4">4+ Hours / Day (Intensive Prep)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="plan-topics" class="form-label">Key Topics / Syllabus Highlights</label>
          <textarea id="plan-topics" class="form-textarea" rows="4" placeholder="List topics you want covered: Virtual memory, paging, thrashing, file systems, deadlock handling..."></textarea>
        </div>

        <button type="submit" id="generate-plan-btn" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
          📅 Generate Master Study Plan
        </button>
      </form>
    </div>

    <!-- Output Container -->
    <div id="plan-result-container" class="card" style="max-width: 820px; margin: 0 auto; display: none;">
      <div class="card-header" style="background:#f8fafc; margin:-24px -24px 20px -24px; padding:18px 24px;">
        <span class="user-badge" style="background:#e0e7ff; color:#3730a3; font-weight:700;">Study Roadmap</span>
        <button onclick="window.print()" class="btn btn-secondary btn-sm">🖨️ Print / Save Plan</button>
      </div>

      <div id="plan-content-body" class="markdown-body" style="line-height:1.7;">
        <!-- Formatted Study Plan -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    AI StudyBuddy — Powered by Google Gemini 2.5 Flash Academic Strategist
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/study-plan.js"></script>
  <script>
    // Set default exam date to 10 days from today
    const d = new Date();
    d.setDate(d.getDate() + 10);
    const dateInput = document.getElementById('plan-exam-date');
    if (dateInput) {
      dateInput.value = d.toISOString().split('T')[0];
    }
  </script>
</body>
</html>
