<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI StudyBuddy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--color-text-main);">Create Student Account</h1>
          <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 6px;">Unlock AI summaries, flashcards, quizzes & RAG</p>
        </div>

        <div id="register-alert-container"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="Alex Morgan" required>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="alex@university.edu" required>
          </div>

          <div class="form-group">
            <label for="reg-password" class="form-label">Password</label>
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required>
          </div>

          <div class="form-group">
            <label for="reg-role" class="form-label">Account Role</label>
            <select id="reg-role" class="form-select">
              <option value="student" selected>Student (Default)</option>
              <option value="admin">Administrator</option>
            </select>
          </div>

          <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--color-text-muted);">
          Already have an account? <a href="/index.html" style="color: var(--color-primary); font-weight: 600;">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    AI StudyBuddy — Powered by Google Gemini 2.5 Flash
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavigation('register');

      const form = document.getElementById('register-form');
      const alertContainer = document.getElementById('register-alert-container');
      const submitBtn = document.getElementById('reg-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const role = document.getElementById('reg-role').value;

        try {
          const res = await apiFetch('/auth/register', {
            method: 'POST',
            body: { name, email, password, role }
          });

          if (res.success && res.token) {
            setAuth(res.token, res.user);
            window.location.href = res.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
          } else {
            alertContainer.innerHTML = `<div class="alert alert-danger">⚠️ ${res.error || 'Registration failed.'}</div>`;
          }
        } catch (err) {
          alertContainer.innerHTML = `<div class="alert alert-danger">Network error: ${err.message}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
